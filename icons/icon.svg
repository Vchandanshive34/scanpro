      <stop offset="0" stop-color="#1b2030"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb96b"/>
      <stop offset="1" stop-color="#f97316"/>
